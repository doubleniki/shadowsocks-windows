name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  create-release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore shadowsocks-windows.sln

    - name: Build Release x86
      run: msbuild shadowsocks-windows.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal

    - name: Build Release x64
      run: msbuild shadowsocks-windows.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

    - name: Create release packages
      run: |
        $version = "${{ github.ref_name }}"

        # Function to calculate hashes
        function Get-FileHashes($file) {
          $newLine = "`r`n"
          $text = (Split-Path $file -Leaf) + $newLine
          $text += 'MD5' + $newLine
          $text += (Get-FileHash $file -Algorithm MD5).Hash + $newLine
          $text += 'SHA-1' + $newLine
          $text += (Get-FileHash $file -Algorithm SHA1).Hash + $newLine
          $text += 'SHA-256' + $newLine
          $text += (Get-FileHash $file -Algorithm SHA256).Hash + $newLine
          $text += 'SHA-512' + $newLine
          $text += (Get-FileHash $file -Algorithm SHA512).Hash
          return $text
        }

        # Function to create release package for a platform
        function Create-ReleasePackage($platform) {
          $buildFolder = "shadowsocks-csharp\bin\$platform\Release"
          $exe = "$buildFolder\Shadowsocks.exe"
          $exeHash = "$exe.hash"
          $zip = "Shadowsocks-$version-$platform.zip"
          $zipHash = "$zip.hash"

          Get-FileHashes -file $exe | Out-File -FilePath $exeHash -Encoding UTF8

          $items = @($exe, $exeHash)
          Get-ChildItem -Path $buildFolder -Directory | ForEach-Object { $items += $_.FullName }
          Compress-Archive -Path $items -DestinationPath $zip -Force

          Get-FileHashes -file $zip | Out-File -FilePath $zipHash -Encoding UTF8

          Write-Host "Release package for $platform created successfully"
        }

        # Create packages for both platforms
        Create-ReleasePackage -platform "x86"
        Create-ReleasePackage -platform "x64"
      shell: pwsh

    - name: Generate changelog
      id: changelog
      run: |
        $version = "${{ github.ref_name }}"

        # Get commits since last tag
        $lastTag = git describe --tags --abbrev=0 HEAD^ 2>$null
        if ($LASTEXITCODE -eq 0) {
          $commits = git log --pretty=format:"- %s (%h)" "$lastTag..HEAD"
        } else {
          $commits = git log --pretty=format:"- %s (%h)" -n 20
        }

        $changelog = @"
        ## What's Changed

        $commits

        ## Download

        This release includes both 32-bit (x86) and 64-bit (x64) builds:
        - **x86**: Compatible with all Windows systems (32-bit and 64-bit)
        - **x64**: Optimized for 64-bit Windows systems

        See the hash file (.hash) to verify the integrity of your download.
        "@

        # Output to file for GitHub Release
        $changelog | Out-File -FilePath changelog.md -Encoding UTF8

        Write-Host "Changelog generated"
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: changelog.md
        files: |
          Shadowsocks-${{ github.ref_name }}-x86.zip
          Shadowsocks-${{ github.ref_name }}-x86.zip.hash
          Shadowsocks-${{ github.ref_name }}-x64.zip
          Shadowsocks-${{ github.ref_name }}-x64.zip.hash
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
